[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grafana-otel-stats"
version = "0.1.0"
description = "Offline user-day intermediate data for Grafana OpenTelemetry contributions"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
grafana-otel-stats = "grafana_stats.cli:main"

[tool.setuptools.packages.find]
include = ["grafana_stats*"]
